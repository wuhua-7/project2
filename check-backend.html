<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>後端連接檢查</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
    .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    button { padding: 10px 20px; margin: 10px 5px; font-size: 16px; cursor: pointer; }
    #log { background: #000; color: #0f0; padding: 15px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🔍 後端連接檢查工具</h1>
  
  <div class="info">
    <strong>當前後端 URL:</strong> <span id="apiUrl"></span>
  </div>

  <div>
    <button onclick="checkBackend()">檢查後端連接</button>
    <button onclick="checkSocket()">檢查 Socket.IO</button>
    <button onclick="checkAll()">全面檢查</button>
  </div>

  <div id="results"></div>
  <div id="log"></div>

  <script>
    const API_URL = 'https://project2-g1cl.onrender.com';
    document.getElementById('apiUrl').textContent = API_URL;

    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const color = type === 'error' ? '#f00' : type === 'success' ? '#0f0' : '#0ff';
      logDiv.innerHTML += `<span style="color: ${color}">[${time}] ${msg}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(msg);
    }

    function showResult(title, success, message) {
      const resultsDiv = document.getElementById('results');
      const className = success ? 'success' : 'error';
      const icon = success ? '✅' : '❌';
      resultsDiv.innerHTML += `
        <div class="${className} status">
          <strong>${icon} ${title}</strong><br>
          ${message}
        </div>
      `;
    }

    async function checkBackend() {
      log('檢查後端 HTTP 連接...');
      
      try {
        const response = await fetch(API_URL, { method: 'GET' });
        log(`HTTP 狀態碼: ${response.status}`, 'success');
        
        if (response.ok || response.status === 404) {
          showResult('後端 HTTP 連接', true, `後端服務正常運行 (狀態碼: ${response.status})`);
          return true;
        } else {
          showResult('後端 HTTP 連接', false, `後端返回錯誤狀態碼: ${response.status}`);
          return false;
        }
      } catch (error) {
        log(`HTTP 連接失敗: ${error.message}`, 'error');
        showResult('後端 HTTP 連接', false, `無法連接到後端: ${error.message}`);
        return false;
      }
    }

    async function checkSocket() {
      log('檢查 Socket.IO 連接...');
      
      return new Promise((resolve) => {
        try {
          // 動態載入 socket.io-client
          const script = document.createElement('script');
          script.src = 'https://cdn.socket.io/4.5.4/socket.io.min.js';
          script.onload = () => {
            log('Socket.IO 客戶端已載入', 'success');
            
            const socket = io(API_URL, {
              transports: ['websocket', 'polling'],
              timeout: 10000
            });

            socket.on('connect', () => {
              log('✓ Socket.IO 連接成功', 'success');
              showResult('Socket.IO 連接', true, `連接 ID: ${socket.id}`);
              socket.disconnect();
              resolve(true);
            });

            socket.on('connect_error', (error) => {
              log(`✗ Socket.IO 連接失敗: ${error.message}`, 'error');
              showResult('Socket.IO 連接', false, `連接錯誤: ${error.message}`);
              resolve(false);
            });

            setTimeout(() => {
              if (!socket.connected) {
                log('Socket.IO 連接超時', 'error');
                showResult('Socket.IO 連接', false, '連接超時（10秒）');
                socket.disconnect();
                resolve(false);
              }
            }, 10000);
          };
          
          script.onerror = () => {
            log('無法載入 Socket.IO 客戶端', 'error');
            showResult('Socket.IO 連接', false, '無法載入 Socket.IO 客戶端庫');
            resolve(false);
          };
          
          document.head.appendChild(script);
        } catch (error) {
          log(`Socket.IO 檢查失敗: ${error.message}`, 'error');
          showResult('Socket.IO 連接', false, error.message);
          resolve(false);
        }
      });
    }

    async function checkAll() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('log').innerHTML = '';
      
      log('=== 開始全面檢查 ===');
      
      const httpOk = await checkBackend();
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      const socketOk = await checkSocket();
      await new Promise(resolve => setTimeout(resolve, 1000));
      
      log('=== 檢查完成 ===');
      
      if (httpOk && socketOk) {
        showResult('總結', true, '所有連接正常！WebRTC 通話應該可以正常工作。');
      } else {
        showResult('總結', false, '發現連接問題！請檢查：\n1. Render 後端是否正常運行\n2. 網絡連接是否正常\n3. 防火牆設置');
      }
    }

    log('頁面已載入，點擊按鈕開始檢查');
  </script>
</body>
</html>
