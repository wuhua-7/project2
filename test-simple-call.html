<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>簡單通話測試</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    #log { background: #000; color: #0f0; padding: 10px; height: 400px; overflow-y: auto; font-family: monospace; }
  </style>
</head>
<body>
  <h1>簡單 WebRTC 通話測試</h1>
  
  <div>
    <button onclick="startCall()">開始通話</button>
    <button onclick="testAudio()">測試音頻</button>
  </div>

  <div>
    <h3>本地音頻:</h3>
    <audio id="localAudio" autoplay muted></audio>
  </div>

  <div>
    <h3>遠程音頻:</h3>
    <audio id="remoteAudio" autoplay></audio>
  </div>

  <div id="log"></div>

  <script>
    function log(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(msg);
    }

    let localStream = null;

    async function startCall() {
      try {
        log('請求麥克風權限...');
        localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } 
        });
        
        log('✓ 成功獲取麥克風');
        log(`音頻軌道數量: ${localStream.getAudioTracks().length}`);
        
        const audioTrack = localStream.getAudioTracks()[0];
        log(`軌道狀態: enabled=${audioTrack.enabled}, muted=${audioTrack.muted}, readyState=${audioTrack.readyState}`);
        
        // 設置到本地音頻元素
        const localAudio = document.getElementById('localAudio');
        localAudio.srcObject = localStream;
        log('✓ 本地音頻已設置');
        
        // 模擬遠程音頻（實際上是本地音頻的副本，用於測試）
        const remoteAudio = document.getElementById('remoteAudio');
        remoteAudio.srcObject = localStream;
        remoteAudio.muted = false; // 取消靜音以聽到自己的聲音
        
        await remoteAudio.play();
        log('✓ 遠程音頻開始播放（你應該能聽到自己的聲音）');
        
      } catch (error) {
        log(`✗ 錯誤: ${error.name} - ${error.message}`);
      }
    }

    async function testAudio() {
      const remoteAudio = document.getElementById('remoteAudio');
      
      log('檢查音頻元素狀態:');
      log(`  srcObject: ${!!remoteAudio.srcObject}`);
      log(`  paused: ${remoteAudio.paused}`);
      log(`  muted: ${remoteAudio.muted}`);
      log(`  volume: ${remoteAudio.volume}`);
      log(`  readyState: ${remoteAudio.readyState}`);
      
      if (remoteAudio.srcObject) {
        const tracks = remoteAudio.srcObject.getAudioTracks();
        log(`  音頻軌道數量: ${tracks.length}`);
        tracks.forEach((t, i) => {
          log(`    軌道 ${i}: enabled=${t.enabled}, muted=${t.muted}, readyState=${t.readyState}`);
        });
        
        try {
          await remoteAudio.play();
          log('✓ 播放成功');
        } catch (err) {
          log(`✗ 播放失敗: ${err.message}`);
        }
      } else {
        log('✗ 沒有音頻流');
      }
    }

    log('頁面已載入，點擊"開始通話"按鈕開始測試');
  </script>
</body>
</html>
